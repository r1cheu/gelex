[workspace]
name = "gelex"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[activation]
env = { CXX = "g++" }

# Single environment supplies every dependency; CMake presets decide what builds.
[dependencies]
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
gxx = ">=15.2.0,<15.3"
gcc = ">=15.2.0,<15.3"
eigen = ">=5,<6"
fmt = ">=12,<12.2"

blas-devel = ">=3.11, <4"
catch2 = ">=3.12.0,<4"
cli11 = ">=2.6,<3"
spdlog = ">=1.17.0,<2"
nanobind = ">=2.13,<3"
python = ">=3.14,<3.15"
numpy = ">=2,<3"
pytest = ">=8,<9"

[tasks]
# Bump the single source of truth for the version (CMake, recipe, docs all read it).
bump = { cmd = "printf '%s\\n' {{ version }} > VERSION", args = [
    { arg = "version" },
] }

# Configure the full tree -> project-wide compile_commands.json for clangd.
# Every build depends on this, so the DB stays in sync (incremental reconfigure is ~0.1s).
init = "cmake --preset dev && ln -sf build/dev/compile_commands.json compile_commands.json"

# Core: `pixi r build`, `build release`, `build reldeb`, ...
build = { cmd = "cmake --preset {{ preset }} && cmake --build --preset {{ preset }}", args = [
    { arg = "preset", default = "debug" },
], depends-on = [
    "init",
] }
test = { cmd = "ctest --preset test-debug", depends-on = [
    { task = "build", args = [
        "debug",
    ] },
] }
test-catch = "./build/debug/tests/gelex_tests"
coverage = { cmd = "cmake --build --preset coverage --target coverage", depends-on = [
    { task = "build", args = [
        "coverage",
    ] },
] }
benchmark = { cmd = "build/benchmark/benchmark/gelex_benchmarks \"[!benchmark]\"", depends-on = [
    { task = "build", args = [
        "benchmark",
    ] },
] }

# CLI: `pixi r build-cli`, `build-cli release`, `run`, `run release`.
build-cli = { cmd = "cmake --preset cli-{{ mode }} && cmake --build --preset cli-{{ mode }}", args = [
    { arg = "mode", default = "debug" },
], depends-on = [
    "init",
] }
run = { cmd = "./build/cli-{{ mode }}/apps/gelex", args = [
    { arg = "mode", default = "debug" },
], depends-on = [
    { task = "build-cli", args = [
        "{{ mode }}",
    ] },
] }

# Python bindings.
build-python = { cmd = "cmake --preset python && cmake --build --preset python", depends-on = [
    "init",
] }
test-python = { cmd = "python -m pytest bindings/tests -q", depends-on = [
    "build-python",
], env = { PYTHONPATH = "bindings/python" } }

# Conda package. --experimental enables `load_from_file` for the VERSION file.
build-conda = "rattler-build build --no-build-id --recipe apps/recipe.yml --experimental --output-dir /tmp/rb-output"

# Docs: isolated environment (Sphinx pypi stack, no C++ toolchain).
[environments]
docs = { features = ["docs"], no-default-feature = true }

[feature.docs.dependencies]
python = ">=3.14.2,<3.15"

[feature.docs.pypi-dependencies]
sphinxcontrib-moderncmakedomain = ">=3.29.0, <4"
furo = ">=2025.12.19, <2026"
sphinx = ">=9.1.0, <10"
sphinx-copybutton = ">=0.5.2, <0.6"
sphinxcontrib-svg2pdfconverter = ">=2.0.0, <3"
sphinx-autobuild = ">=2025.8.25, <2026"

[feature.docs.tasks]
build-doc = "sphinx-build -b html docs/source docs/build/html"
serve-doc = { cmd = "python -m http.server 3030 -d docs/build/html", depends-on = [
    "build-doc",
] }
watch-doc = "sphinx-autobuild -b html docs/source docs/build/html --host 0.0.0.0 --port 3030"
