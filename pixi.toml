[workspace]
name = "gelex"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[activation]
env = { CXX = "g++" }

[dependencies]
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
gxx = ">=15.2.0,<15.3"
gcc = ">=15.2.0,<15.3"
eigen = ">=5,<6"
fmt = ">=12,<12.2"
openblas = { version = ">=0.3.31,<0.4", build = "*openmp*" }
catch2 = ">=3.12.0,<4"

# ---------------------------------------------------------
# Core: build any preset (configure folded in; reconfigure is cheap).
# e.g. `pixi r build`, `pixi r build release`, `pixi r build reldeb`
# ---------------------------------------------------------
[tasks.build]
args = [{ arg = "preset", default = "debug" }]
cmd = "cmake --preset {{ preset }} && cmake --build --preset {{ preset }}"

# ---------------------------------------------------------
# Core: test / coverage / benchmark (each builds its preset first)
# ---------------------------------------------------------
[tasks.test]
cmd = "ctest --preset test-debug"
depends-on = [{ task = "build", args = ["debug"] }]

[tasks.test-catch]
cmd = "./build/debug/tests/gelex_tests"

[tasks.coverage]
cmd = "cmake --build --preset coverage --target coverage"
depends-on = [{ task = "build", args = ["coverage"] }]

[tasks.benchmark]
cmd = "build/benchmark/benchmark/gelex_benchmarks \"[!benchmark]\""
depends-on = [{ task = "build", args = ["benchmark"] }]

# ---------------------------------------------------------
# CLI (opt-in env): core + gelex_cli in build/cli-{debug,release}.
# e.g. `pixi r build-cli`, `pixi r build-cli release`, `pixi r run release`
# ---------------------------------------------------------
[feature.cli.dependencies]
cli11 = ">=2.6,<3"
spdlog = ">=1.17.0,<2"

[feature.cli.tasks.build-cli]
args = [{ arg = "mode", default = "debug" }]
cmd = "cmake --preset cli-{{ mode }} && cmake --build --preset cli-{{ mode }}"

[feature.cli.tasks.run]
args = [{ arg = "mode", default = "debug" }]
cmd = "./build/cli-{{ mode }}/apps/gelex"
depends-on = [{ task = "build-cli", args = ["{{ mode }}"] }]

# ---------------------------------------------------------
# Python bindings (opt-in feature): builds the core + _gelex in build/python
# ---------------------------------------------------------
[feature.python.dependencies]
nanobind = ">=2.13,<3"
python = ">=3.14,<3.15"
numpy = ">=2,<3"
pytest = ">=8,<9"

[feature.python.tasks.build-python]
cmd = "cmake --preset python && cmake --build --preset python"

[feature.python.tasks.test-python]
cmd = "python -m pytest bindings/tests -q"
depends-on = ["build-python"]
env = { PYTHONPATH = "bindings/python" }

# ---------------------------------------------------------
# Environments
# ---------------------------------------------------------
[environments]
cli = { features = ["cli"] }
python = { features = ["python"] }
docs = { features = ["docs"], no-default-feature = true }

[feature.docs.dependencies]
python = ">=3.14.2,<3.15"

[feature.docs.pypi-dependencies]
sphinxcontrib-moderncmakedomain = ">=3.29.0, <4"
furo = ">=2025.12.19, <2026"
sphinx = ">=9.1.0, <10"
sphinx-copybutton = ">=0.5.2, <0.6"
sphinxcontrib-svg2pdfconverter = ">=2.0.0, <3"
sphinx-autobuild = ">=2025.8.25, <2026"

[feature.docs.tasks.build-doc]
cmd = ["sphinx-build", "-b", "html", "docs/source", "docs/build/html"]

[feature.docs.tasks.serve-doc]
cmd = ["python", "-m", "http.server", "3030", "-d", "docs/build/html"]
depends-on = ["build-doc"]

[feature.docs.tasks.watch-doc]
cmd = [
    "sphinx-autobuild",
    "-b",
    "html",
    "docs/source",
    "docs/build/html",
    "--host",
    "0.0.0.0",
    "--port",
    "3030",
]
