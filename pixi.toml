[workspace]
name = "gelex"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[activation]
env = { CXX = "g++" }

[dependencies]
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
gxx = ">=15.2.0,<15.3"
gcc = ">=15.2.0,<15.3"
eigen = ">=5,<6"
fmt = ">=12,<12.2"
openblas = { version = ">=0.3.31,<0.4", build = "*openmp*" }
catch2 = ">=3.12.0,<4"

[package]
name = "libgelex"
version = "0.18.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.build.config]
extra-args = [
    "-DGELEX_USE_MKL=OFF",
    "-DGELEX_BUILD_TESTS=OFF",
    "-DGELEX_BUILD_BENCHMARKS=OFF",
]

[package.host-dependencies]
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
eigen = ">=5,<6"
fmt = ">=12,<12.2"
openblas = { version = ">=0.3.31,<0.4", build = "*openmp*" }

[package.run-dependencies]
fmt = ">=12,<12.2"
eigen = ">=5,<6"
openblas = { version = ">=0.3.31,<0.4", build = "*openmp*" }

# ---------------------------------------------------------
# Build (configure folded in; reconfigure is cheap & idempotent)
# ---------------------------------------------------------
[tasks.build-debug]
cmd = "cmake --preset debug && cmake --build --preset debug -j$(nproc)"

[tasks.build-release]
cmd = "cmake --preset release && cmake --build --preset release -j$(nproc)"

# ---------------------------------------------------------
# Test
# ---------------------------------------------------------
[tasks.test]
cmd = "ctest --preset test-debug"
depends-on = ["build-debug"]

[tasks.test-catch]
cmd = "./build/debug/tests/gelex_tests"

# ---------------------------------------------------------
# Coverage / Benchmark
# ---------------------------------------------------------
[tasks.coverage]
cmd = "cmake --preset coverage && cmake --build --preset coverage -j$(nproc) && cmake --build --preset coverage --target coverage"

[tasks.benchmark]
cmd = "cmake --preset benchmark && cmake --build --preset benchmark -j$(nproc) && build/benchmark/benchmark/gelex_benchmarks \"[!benchmark]\""

[environments]
docs = { features = ["docs"], no-default-feature = true }

[feature.docs.dependencies]
python = ">=3.14.2,<3.15"

[feature.docs.pypi-dependencies]
sphinxcontrib-moderncmakedomain = ">=3.29.0, <4"
furo = ">=2025.12.19, <2026"
sphinx = ">=9.1.0, <10"
sphinx-copybutton = ">=0.5.2, <0.6"
sphinxcontrib-svg2pdfconverter = ">=2.0.0, <3"
sphinx-autobuild = ">=2025.8.25, <2026"

[feature.docs.tasks.build-doc]
cmd = ["sphinx-build", "-b", "html", "docs/source", "docs/build/html"]

[feature.docs.tasks.serve-doc]
cmd = ["python", "-m", "http.server", "3030", "-d", "docs/build/html"]
depends-on = ["build-doc"]

[feature.docs.tasks.watch-doc]
cmd = [
    "sphinx-autobuild",
    "-b",
    "html",
    "docs/source",
    "docs/build/html",
    "--host",
    "0.0.0.0",
    "--port",
    "3030",
]
