[workspace]
name = "gelex-py"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[activation]
env = { CXX = "g++" }

# Development environment (default): build the nanobind extension against the
# libgelex conda package. pixi rebuilds libgelex automatically when ../ changes.
[dependencies]
libgelex = { path = ".." }
nanobind = ">=2.4,<3"
python = ">=3.12,<3.13"
numpy = ">=2,<3"
pytest = ">=8,<9"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
gxx = ">=15.2.0,<15.3"
gcc = ">=15.2.0,<15.3"

[tasks.build]
cmd = "cmake -S . -B build -DCMAKE_PREFIX_PATH=$CONDA_PREFIX && cmake --build build -j$(nproc)"

[tasks.test]
cmd = "python -m pytest tests -q"
depends-on = ["build"]
env = { PYTHONPATH = "python" }

# Conda package: installs _gelex + the python package into site-packages, so any
# environment depending on gelex-python can `import gelex` natively. Mirrors the
# libgelex / gelex-cli packaging pattern.
[package]
name = "gelex-python"
version = "0.18.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.host-dependencies]
libgelex = { path = ".." }
nanobind = ">=2.4,<3"
python = ">=3.12,<3.13"
numpy = ">=2,<3"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"

[package.run-dependencies]
libgelex = { path = ".." }
python = ">=3.12,<3.13"
numpy = ">=2,<3"
